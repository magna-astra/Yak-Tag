<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YAK-TAG — Малын бүртгэл</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/logo-180.png">
<meta name="theme-color" content="#0E1929">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#0E1929;
  --ink-soft:#55627A;
  --line:#E2E6EC;
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --khukh:#1B4FA8;
  --khukh-light:#EAF0FB;
  --gold:#B8892C;
  --gold-light:#FBF3E2;
  --steppe:#2F7A46;
  --steppe-light:#E9F4ED;
  --alert:#B3341F;
  --alert-light:#FBEBE8;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-bottom:40px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:16px}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(170deg,#0E1929,#16283F)}
.login-card{background:var(--card);border-radius:18px;padding:36px 30px;width:100%;max-width:400px;
  box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-logo{width:68px;height:68px;display:block;margin:0 auto 18px}
.login-card h1{font-size:1.2rem;font-weight:700;text-align:center}
.login-card .sub{text-align:center;color:var(--ink-soft);font-size:.87rem;margin:6px 0 24px}
.field{margin-bottom:15px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--ink-soft)}
.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px}
.field input:focus{outline:none;border-color:var(--khukh);box-shadow:0 0 0 3px var(--khukh-light)}
.btn-primary{width:100%;padding:14px;background:var(--khukh);color:#fff;border:0;border-radius:11px;
  font-weight:600;font-size:1rem}
.btn-primary:disabled{opacity:.55}
.err{background:var(--alert-light);color:var(--alert);padding:10px 13px;border-radius:9px;
  font-size:.85rem;margin-bottom:15px;display:none}

/* ---------- APP ---------- */
.app{display:none;max-width:560px;margin:0 auto;padding:0 16px}

header.cowhead{background:var(--ink);color:#fff;margin:0 -16px 18px;padding:18px 20px 22px;
  border-radius:0 0 20px 20px}
.cowhead .row1{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.cowhead img{width:28px;height:28px;filter:invert(1)}
.cowhead .brand{font-weight:700;font-size:.9rem;letter-spacing:.04em}
.cowhead .out{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:5px 11px;border-radius:8px;font-size:.78rem}
.tagbig{font-family:var(--mono);font-size:2rem;font-weight:700;letter-spacing:-.01em}
.cowmeta{color:#9FB0C6;font-size:.88rem;margin-top:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:.95rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--khukh);flex:0 0 auto}

.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F2F5;font-size:.9rem}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-soft)}
.kv span:last-child{font-weight:600;text-align:right}
.kv .mono{font-family:var(--mono);font-size:.85rem}

/* milk entry */
.milk-entry{display:flex;gap:10px;align-items:stretch}
.milk-entry input{flex:1;padding:15px;border:2px solid var(--line);border-radius:12px;
  font-family:var(--mono);font-size:1.5rem;font-weight:700;text-align:center}
.milk-entry input:focus{outline:none;border-color:var(--khukh)}
.milk-entry button{padding:0 24px;background:var(--steppe);color:#fff;border:0;border-radius:12px;
  font-weight:700;font-size:1rem;white-space:nowrap}
.milk-entry button:disabled{opacity:.5}
.milk-done{background:var(--steppe-light);color:var(--steppe);padding:13px;border-radius:11px;
  font-weight:600;text-align:center;font-size:.92rem}
.hint{font-size:.8rem;color:var(--ink-soft);margin-top:9px}

/* photo */
.photo-btn{width:100%;padding:20px;background:var(--khukh);color:#fff;border:0;border-radius:13px;
  font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px}
.photo-btn:disabled{opacity:.55}
.photo-btn.locked{background:#EEF0F4;color:var(--ink-soft)}
.kind-pick{display:flex;gap:8px;margin-bottom:13px}
.kind-pick button{flex:1;padding:11px 6px;border:1.5px solid var(--line);background:#fff;
  border-radius:10px;font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.kind-pick button.on{border-color:var(--khukh);background:var(--khukh-light);color:var(--khukh)}
#preview{width:100%;border-radius:12px;margin-top:13px;display:none}
.gps-note{display:flex;align-items:center;gap:8px;font-size:.83rem;color:var(--ink-soft);
  margin-top:12px;padding:11px;background:#F7F8FA;border-radius:10px}
.gps-note.ok{background:var(--steppe-light);color:var(--steppe)}
.gps-note.bad{background:var(--gold-light);color:var(--gold)}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photo-grid figure{position:relative}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#EEF0F4}
.photo-grid figcaption{font-size:.7rem;color:var(--ink-soft);margin-top:4px;text-align:center}
.lockicon{position:absolute;top:5px;right:5px;background:rgba(14,25,41,.82);color:#fff;
  font-size:.62rem;padding:2px 6px;border-radius:5px;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;
  padding:13px 22px;border-radius:11px;font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.bad{background:var(--alert)}

.feed-btn{width:100%;margin-top:12px;padding:14px;background:var(--gold-light);color:var(--gold);
  border:1.5px solid #EBD9B0;border-radius:12px;font-weight:700;font-size:.95rem}
.feed-btn:disabled{opacity:.5}

.milk-tabs{display:flex;gap:8px;margin-bottom:14px}
.milk-tabs button{flex:1;padding:9px 6px;border:1.5px solid var(--line);background:#fff;
  border-radius:9px;font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.milk-tabs button.on{border-color:var(--khukh);background:var(--khukh-light);color:var(--khukh)}
.milk-chart{min-height:120px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-bottom:8px}
.bars div{flex:1;background:var(--khukh);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.zero{background:#E8EBF0}
.barlabels{display:flex;gap:5px;font-size:.65rem;color:var(--ink-soft);text-align:center}
.barlabels span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.milk-total{display:flex;justify-content:space-between;padding-top:12px;margin-top:12px;
  border-top:1px solid #F0F2F5;font-size:.9rem}
.milk-total b{font-family:var(--mono)}

.phone-entry{display:flex;gap:10px}
.phone-entry input{flex:1;padding:14px;border:2px solid var(--line);border-radius:12px;
  font-family:var(--mono);font-size:1.15rem;font-weight:600;text-align:center}
.phone-entry input:focus{outline:none;border-color:var(--khukh)}
.phone-entry button{padding:0 20px;background:var(--khukh);color:#fff;border:0;
  border-radius:12px;font-weight:700;white-space:nowrap}
.phone-entry button:disabled{opacity:.5}
.phone-locked{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--steppe-light);color:var(--steppe);padding:15px;border-radius:12px;
  font-weight:700}
.phone-locked .num{font-family:var(--mono);font-size:1.1rem}
.lockbtn{width:100%;margin-top:10px;padding:12px;background:#fff;color:var(--ink-soft);
  border:1.5px solid var(--line);border-radius:11px;font-weight:600;font-size:.88rem}
.delphoto{width:100%;margin-top:4px;padding:4px;background:#fff;color:#B3341F;
  border:1px solid #F0D4CE;border-radius:7px;font-size:.64rem;font-weight:700;cursor:pointer}
.delphoto:hover{background:#FCEAE7}
.pubtag,.privtag{display:block;margin-top:5px;padding:4px;border-radius:7px;
  font-size:.64rem;font-weight:700;text-align:center}
.pubtag{background:var(--steppe-light);color:var(--steppe)}
.privtag{background:#F0F2F5;color:var(--ink-soft)}
.kbtag{font-family:var(--mono);font-size:.62rem;color:var(--ink-soft)}
.notfound{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.pwover{position:fixed;inset:0;background:rgba(14,25,41,.55);display:none;place-items:center;
  padding:16px;z-index:900}
.pwover.on{display:grid}
.pwover .card{width:100%;max-width:400px;margin:0}
.offbar{background:#F0F2F5;color:var(--ink-soft);padding:11px 14px;border-radius:12px;
  font-size:.84rem;font-weight:600;line-height:1.5;margin:14px 16px 0}
.notfound h2{color:var(--ink);margin-bottom:8px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <img src="assets/logo-256.png" alt="YAK-TAG" class="login-logo">
    <h1>YAK-TAG</h1>
    <p class="sub">Малын бүртгэл рүү нэвтрэх</p>
    <div class="err" id="loginErr"></div>
    <div class="field">
      <label for="email">Утас эсвэл и-мэйл</label>
      <input type="text" id="email" autocomplete="username" inputmode="tel" placeholder="99112233">
    </div>
    <div class="field">
      <label for="password">Нууц үг</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="loginBtn">Нэвтрэх</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="appView">
  <header class="cowhead">
    <div class="row1">
      <img src="assets/logo-64.png" alt="">
      <span class="brand">YAK-TAG</span>
      <button class="out" id="myPwBtn" style="margin-left:auto">Нууц үг</button>
      <button class="out" id="signoutBtn" style="margin-left:8px">Гарах</button>
    </div>
    <div class="tagbig" id="tagBig">—</div>
    <div class="cowmeta" id="cowMeta">Ачаалж байна…</div>
  </header>

  <div id="cowBody"></div>
</div>

<!-- Change own password. Forgot it? The admin sets a new one. -->
<div class="pwover" id="myPwModal">
  <div class="card">
    <h2><span class="dot"></span>Нууц үг солих</h2>
    <p class="hint" style="margin:0 0 14px">Одоогийн нууц үгээ мартсан бол админд хандана уу.</p>
    <div class="field"><label for="mpOld">Одоогийн нууц үг</label>
      <input type="password" id="mpOld" autocomplete="current-password"></div>
    <div class="field"><label for="mpNew">Шинэ нууц үг (8+ тэмдэгт)</label>
      <input type="password" id="mpNew" autocomplete="new-password"></div>
    <div class="field"><label for="mpNew2">Дахин оруулах</label>
      <input type="password" id="mpNew2" autocomplete="new-password"></div>
    <div class="err" id="mpErr"></div>
    <button class="btn-primary" id="mpSave">Солих</button>
    <button class="btn-primary" id="mpCancel"
            style="margin-top:8px;background:#F0F2F5;color:var(--ink)">Болих</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">

<script src="config.js"></script>
<script src="offline.js"></script>
<script>
let cow = null;
let isSuper = false;
let gps = null;
let photoKind = 'profile';

// ---------- helpers ----------
function toast(msg, bad=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  setTimeout(() => t.className = 'toast', 2600);
}

// Anything typed by a user (names, breed, phone) or returned as an
// error goes through this before it touches innerHTML.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function getTagFromUrl() {
  const p = new URLSearchParams(location.search);
  return p.get('tag') || p.get('slug') || p.get('uid');
}

// ---------- login ----------
const loginBtn = document.getElementById('loginBtn');
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  loginBtn.disabled = true; loginBtn.textContent = 'Нэвтэрч байна…';
  const { error } = await sb.auth.signInWithPassword({ email: loginEmail(email), password });
  loginBtn.disabled = false; loginBtn.textContent = 'Нэвтрэх';
  if (error) {
    const e = document.getElementById('loginErr');
    e.textContent = 'Утас/и-мэйл эсвэл нууц үг буруу байна.';
    e.style.display = 'block';
    return;
  }
  boot();
}
loginBtn.addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
// ---------- change own password ----------
// Proves the current password first (a fresh sign-in), then sets the
// new one. No codes, no email: a forgotten password is reset by the admin.
document.getElementById('myPwBtn').addEventListener('click', () => {
  ['mpOld', 'mpNew', 'mpNew2'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('mpErr').style.display = 'none';
  document.getElementById('myPwModal').classList.add('on');
});
document.getElementById('mpCancel').addEventListener('click', () =>
  document.getElementById('myPwModal').classList.remove('on'));
document.getElementById('mpSave').addEventListener('click', async () => {
  const err = document.getElementById('mpErr');
  const show = m => { err.textContent = m; err.style.display = 'block'; };
  const oldPw = document.getElementById('mpOld').value;
  const p1 = document.getElementById('mpNew').value, p2 = document.getElementById('mpNew2').value;
  if (p1.length < 8) return show('Шинэ нууц үг хамгийн багадаа 8 тэмдэгт.');
  if (p1 !== p2) return show('Шинэ нууц үг таарахгүй байна.');
  if (!navigator.onLine) return show('Сүлжээ шаардлагатай.');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('Дахин нэвтэрнэ үү.');
  const { error: e1 } = await sb.auth.signInWithPassword({ email: session.user.email, password: oldPw });
  if (e1) return show('Одоогийн нууц үг буруу байна.');
  const { error: e2 } = await sb.auth.updateUser({ password: p1 });
  if (e2) return show('Сольж чадсангүй: ' + e2.message);
  document.getElementById('myPwModal').classList.remove('on');
  toast('Нууц үг солигдлоо');
});

document.getElementById('signoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut(); location.reload();
});

// ---------- GPS ----------
// Resolves once the phone has answered (fix or refusal), so the scan
// can wait for a position instead of being logged without one.
function requestGps() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { updateGpsNote(); resolve(); return; }
    navigator.geolocation.getCurrentPosition(
      pos => {
        gps = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        updateGpsNote();
        resolve();
      },
      () => { updateGpsNote(); resolve(); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
    );
  });
}

function updateGpsNote() {
  const el = document.getElementById('gpsNote');
  if (!el) return;
  if (gps) {
    el.className = 'gps-note ok';
    el.textContent = `Байршил тогтоогдсон · ${gps.lat.toFixed(5)}, ${gps.lng.toFixed(5)} (±${Math.round(gps.accuracy)}м)`;
  } else {
    el.className = 'gps-note bad';
    el.textContent = 'Байршил тогтоогдоогүй — утасныхаа байршлын зөвшөөрлийг асаана уу.';
  }
}

// ---------- boot ----------
// The moment this page opened = when the tag was tapped. Used as the
// scan time even if GPS or the network answers much later.
const openedAt = new Date().toISOString();
let offlineMode = false;

function isOffline(error) {
  if (!navigator.onLine) return true;
  return /fetch|network|load failed|timeout|abort/i.test(String(error && (error.message || error)));
}
// Last good copy of each animal and of who is signed in, on this phone
// only, so the page still opens (and the scan is still saved) with no
// signal. Holds only what this page already showed its owner.
function cacheGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function cacheSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function boot() {
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) {}

  // No signal and the login token needs refreshing: getSession() gives
  // nothing. Open from the saved copy if this phone has one — the
  // queued scan is sent with a fresh token once the network is back.
  if (!session && !navigator.onLine && cacheGet('yt-uid')) {
    offlineMode = true;
  } else if (!session) {
    document.getElementById('loginView').style.display = 'grid';
    document.getElementById('appView').style.display = 'none';
    return;
  }
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';

  if (session) cacheSet('yt-uid', session.user.id);

  // Role decides whether destructive actions appear. The database
  // enforces it independently — this only hides what would fail anyway.
  let prof = null;
  if (!offlineMode) { try { prof = await myProfile(); } catch (e) {} }
  isSuper = !!(prof && prof.role === 'super_admin');

  const tag = getTagFromUrl();
  if (!tag) {
    document.getElementById('cowBody').innerHTML =
      `<div class="notfound"><h2>Таг заагаагүй байна</h2>
       <p>NFC таг уншуулах эсвэл хаяганд ?tag=YT-008000 нэмнэ үү.</p></div>`;
    return;
  }
  const gpsReady = requestGps();
  await loadCow(tag);
  if (!cow) return;

  // One scan per page open, logged after GPS answers. The timeout
  // covers a permission prompt the herder never taps — without it
  // the scan would never be recorded at all.
  // Offline, a cold GPS fix takes longer (no network assistance).
  const wait = navigator.onLine ? 20000 : 35000;
  await Promise.race([gpsReady, new Promise(r => setTimeout(r, wait))]);
  logScan();
}

async function loadCow(tag) {
  let data = null, error = null;
  if (!offlineMode) {
    try {
      ({ data, error } = await sb
        .from('cattle_dashboard')
        .select('*')
        .eq('tag_code', tag)
        .maybeSingle());
    } catch (e) { error = e; }
  }

  if (offlineMode || (error && isOffline(error))) {
    const saved = cacheGet('yt-cow:' + tag);
    if (saved) {
      cow = saved;
      renderCow();
      document.getElementById('cowBody').insertAdjacentHTML('afterbegin',
        `<div class="offbar">Сүлжээ байхгүй — энэ утсанд сүүлд хадгалсан мэдээлэл.
         Уншуулалт утсанд хадгалагдаж, сүлжээ орохоор илгээгдэнэ.
         Сүү, тэжээл, зураг сүлжээтэй үед л хадгалагдана.</div>`);
      return;
    }
    document.getElementById('tagBig').textContent = tag;
    document.getElementById('cowMeta').textContent = 'Сүлжээ байхгүй';
    document.getElementById('cowBody').innerHTML =
      `<div class="notfound"><h2>Сүлжээ байхгүй</h2>
       <p>Энэ мал энэ утсанд хадгалагдаагүй байна. Сүлжээтэй газар нэг удаа
       нээвэл дараа нь сүлжээгүй үед ч нээгдэнэ.</p></div>`;
    return;
  }

  // No animal on this tag (or none this user may see). If it is a new
  // tag of the user's farm, offer registration instead of "not found".
  if (!error && !data) {
    let info = null;
    try {
      const r = await sb.rpc('tag_registration_info', { p_tag_code: tag });
      if (!r.error && r.data && r.data.length) info = r.data[0];
    } catch (e) {}                             // before schema_v25: old message
    if (info) { renderRegistration(tag, info); return; }
  }

  if (error || !data) {
    document.getElementById('tagBig').textContent = tag;
    document.getElementById('cowMeta').textContent = 'Олдсонгүй';
    document.getElementById('cowBody').innerHTML =
      `<div class="notfound"><h2>Мал олдсонгүй</h2>
       <p>Энэ таг таны ферм дээр бүртгэлгүй байна.</p></div>`;
    return;
  }
  cow = data;
  cacheSet('yt-cow:' + tag, data);
  renderCow();
  loadPhotos();
  // The scan itself is logged once, from boot(). loadCow() is also
  // used to refresh after every save and must not add fake encounters.
}

async function saveRegistration(tag, getSex) {
  const err = document.getElementById('regErr');
  const btn = document.getElementById('regSave');
  const showErr = m => { err.textContent = m; err.style.display = 'block'; };
  err.style.display = 'none';

  const sex = getSex();
  const year = parseInt(document.getElementById('regYear').value, 10);
  if (!sex) return showErr('Хүйсээ сонгоно уу.');
  if (!year || year < 1990 || year > new Date().getFullYear()) return showErr('Төрсөн оноо зөв оруулна уу.');
  if (!navigator.onLine) return showErr('Бүртгэхэд сүлжээ шаардлагатай.');

  btn.disabled = true; btn.textContent = 'Бүртгэж байна…';
  const { error } = await sb.rpc('register_cattle', {
    p_tag_code: tag, p_sex: sex, p_birth_year: year,
    p_breed: document.getElementById('regBreed').value.trim() || null,
    p_colour: document.getElementById('regColour').value.trim() || null,
    p_lat: gps ? gps.lat : null, p_lng: gps ? gps.lng : null
  });
  btn.disabled = false; btn.textContent = 'Бүртгэх';
  if (error) return showErr(error.message);

  toast('Мал бүртгэгдлээ — одоо бүтэн биеийн зураг аваарай');
  await loadCow(tag);
  if (cow) logScan();            // registering is also an encounter
}

// Publish the newest profile photo automatically.
// Runs whenever the page loads, so photos taken before this existed
// get fixed with no action from the herder.
async function autoPublish(photos) {
  if (!photos || !photos.length) return;
  if (cow.public_photo_path) return;              // already published
  if (autoPublish.running) return;                // don't stack retries

  // Checked before taking the flag — returning after it left the flag
  // stuck on, so auto-publish never ran again until a page reload.
  const profile = photos.find(p => p.kind === 'profile');
  if (!profile) return;
  autoPublish.running = true;

  const note = document.getElementById('pubNote');
  if (note) note.innerHTML = '<span style="color:var(--ink-soft)">Нийтийн зураг бэлтгэж байна…</span>';

  try {
    const { data: blob, error: dlErr } = await sb.storage
      .from('cattle-photos').download(profile.storage_path);
    if (dlErr) throw dlErr;

    const pubPath = `farm-${cow.farm_id}/cow-${cow.id}/profile-${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage
      .from('cattle-public')
      .upload(pubPath, blob, { contentType: 'image/jpeg', upsert: true });
    if (upErr) throw upErr;

    const { error: ptrErr } = await sb.rpc('set_public_photo', {
      p_cattle_id: cow.id, p_path: pubPath
    });
    if (ptrErr) throw ptrErr;

    cow.public_photo_path = pubPath;
    if (note) note.innerHTML =
      '<span style="color:var(--steppe)">✓ Нийтийн зураг бэлэн — таг уншуулахад харагдана</span>';
  } catch (e) {
    const msg = (e && e.message) || String(e);
    if (note) note.innerHTML =
      `<span style="color:#B3341F">Нийтийн зураг бэлтгэж чадсангүй: ${esc(msg)}</span>`;
    console.error('autoPublish failed:', e);
  } finally {
    autoPublish.running = false;
  }
}


// Deleting a photo is destructive and logged. There is deliberately no
// "replace" action: the super admin is not next to the animal, so the
// honest workflow is delete, then the herder retakes it.
async function deletePhoto(id, kindLabel) {
  if (!confirm(`"${kindLabel}" зургийг бүрмөсөн устгах уу?\n\nЭнэ үйлдлийг буцаах боломжгүй. Устгасан нь бүртгэгдэнэ.`)) return;
  const reason = prompt('Шалтгаан (бүртгэлд үлдэнэ):', 'Буруу зураг');
  if (reason === null) return;

  const { error } = await sb.rpc('delete_photo', { photo_id: id, reason: reason || '—' });
  if (error) { toast('Устгаж чадсангүй: ' + error.message, true); return; }
  toast('Зураг устлаа');
  await loadCow(cow.tag_code);
}

async function savePhone(lock){
  const input = document.getElementById('phoneInput');
  const phone = input.value.trim();
  if(!phone){ toast('Дугаараа оруулна уу.', true); return; }
  // Same rule the database enforces (schema_v21) — digits, +, space, -, ().
  if(!/^\+?[0-9][0-9 ()-]{5,19}$/.test(phone)){
    toast('Утасны дугаар буруу байна. Зөвхөн тоо оруулна уу.', true); return;
  }

  const { error } = await sb.rpc('set_contact_phone', {
    p_cattle_id: cow.id, p_phone: phone, p_lock: lock
  });
  if(error){ toast('Хадгалж чадсангүй: ' + error.message, true); return; }
  toast(lock ? 'Дугаар түгжигдлээ' : 'Дугаар хадгалагдлаа');
  await loadCow(cow.tag_code);
}

// ---------- photo ----------
document.getElementById('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;

  const preview = document.getElementById('preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';

  const btn = document.getElementById('photoBtn');
  btn.disabled = true;
  btn.textContent = 'Хадгалж байна…';

  try {
    const { data: { user } } = await sb.auth.getUser();

    // shrink before upload — herder phones on 3G in the countryside
    const blob = await shrinkImage(file, 1200, 0.75);
    const path = `farm-${cow.farm_id}/cow-${cow.id}/${photoKind}-${Date.now()}.jpg`;

    // 1. upload the actual file
    const { error: upErr } = await sb.storage
      .from('cattle-photos')
      .upload(path, blob, { contentType: 'image/jpeg', upsert: false });
    if (upErr) throw upErr;

    // 2. a "profile" shot also goes to the PUBLIC bucket, because the
    //    tap page must show it to someone with no login. Muzzle prints
    //    and everything else stay in the private bucket only.
    // Every profile shot is public by rule. Nothing to opt into.
    if (photoKind === 'profile') {
      // Cache-busting filename: browsers and the CDN hold on to a
      // public URL, so overwriting profile.jpg would keep serving the
      // old picture for hours.
      const pubPath = `farm-${cow.farm_id}/cow-${cow.id}/profile-${Date.now()}.jpg`;
      const { error: pubErr } = await sb.storage
        .from('cattle-public')
        .upload(pubPath, blob, { contentType: 'image/jpeg', upsert: true });

      if (pubErr) {
        // Surface it rather than failing quietly — a photo the owner
        // believes is public but isn't is worse than a visible error.
        toast('Нийтийн зураг хадгалагдсангүй: ' + pubErr.message, true);
      } else {
        // Saved through a function: a direct UPDATE on cattle is
        // rejected for herders by the row policy.
        const { error: ptrErr } = await sb.rpc('set_public_photo', {
          p_cattle_id: cow.id, p_path: pubPath
        });
        if (ptrErr) toast('Зураг холбогдсонгүй: ' + ptrErr.message, true);
        // Record it locally too, or loadPhotos() → autoPublish() sees
        // no public photo and uploads the same picture a second time.
        else cow.public_photo_path = pubPath;
      }
    }

    // 3. write the record, locked immediately
    const { error: dbErr } = await sb.from('cattle_photos').insert({
      farm_id: cow.farm_id,
      cattle_id: cow.id,
      kind: photoKind,
      storage_path: path,
      bytes: blob.size,
      taken_lat: gps ? gps.lat : null,
      taken_lng: gps ? gps.lng : null,
      taken_at: new Date().toISOString(),
      // locked_at is NOT sent from the client. The photo-lock design
      // freezes rows server-side; asking the browser to declare its own
      // lock state was both redundant and part of what the insert
      // policy rejected.
    });
    if (dbErr) throw dbErr;

    const kb = Math.round(blob.size/1024);
    toast(gps ? `Зураг хадгалагдлаа · ${kb}KB · GPS` : `Зураг хадгалагдлаа · ${kb}KB`);
    preview.style.display = 'none';
    loadPhotos();
  } catch (err) {
    toast('Хадгалж чадсангүй: ' + (err.message || err), true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Камер нээх';
    e.target.value = '';
  }
});

// Resize on the phone before upload. Two reasons:
//  1. A 12MP phone photo is ~4MB — slow and expensive on rural mobile data.
//  2. Storage adds up: at 1200px/0.75 a photo is ~190KB, so 1GB holds
//     ~5,500 photos. At full size it would hold ~2,400.
// 1200px still resolves muzzle-print detail clearly.
function shrinkImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const scale = Math.min(1, maxSide / Math.max(width, height));
      width = Math.round(width * scale);
      height = Math.round(height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('Зураг боловсруулж чадсангүй')),
                    'image/jpeg', quality);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error('Зураг уншиж чадсангүй'));
    img.src = URL.createObjectURL(file);
  });
}

async function loadPhotos() {
  const grid = document.getElementById('photoGrid');
  if (!grid) return;

  const { data, error } = await sb
    .from('cattle_photos')
    .select('id, kind, taken_at, taken_lat, storage_path, locked_at, bytes')
    .eq('cattle_id', cow.id)
    .order('taken_at', { ascending: false })
    .limit(6);

  if (error) {
    grid.innerHTML = `<p class="hint" style="grid-column:1/-1;color:#B3341F">
      Зураг уншиж чадсангүй: ${esc(error.message)}</p>`;
    return;
  }
  if (!data || !data.length) { grid.innerHTML = ''; return; }

  const label = { muzzle:'Хамар', profile:'Бүтэн бие', marking:'Тэмдэг',
                  transfer:'Шилжүүлэг', health:'Эрүүл мэнд' };

  // Private bucket — thumbnails need short-lived signed URLs.
  const paths = data.map(p => p.storage_path);
  const { data: signed, error: sErr } = await sb.storage
    .from('cattle-photos')
    .createSignedUrls(paths, 3600);

  if (sErr) {
    grid.innerHTML = `<p class="hint" style="grid-column:1/-1;color:#B3341F">
      Зургийн холбоос үүсгэж чадсангүй: ${esc(sErr.message)}</p>`;
    return;
  }

  const urlFor = {};
  (signed || []).forEach(x => { if (x.signedUrl) urlFor[x.path] = x.signedUrl; });

  grid.innerHTML = data.map(p => {
    const url = urlFor[p.storage_path];
    const img = url
      ? `<img src="${url}" alt="${label[p.kind] || p.kind}" loading="lazy">`
      : `<img src="assets/logo-256.png" alt="" style="object-fit:contain;padding:18%;opacity:.2"
           title="Файл олдсонгүй">`;
    const lock = p.locked_at ? '<span class="lockicon">Түгжээтэй</span>' : '';
    const geo = p.taken_lat ? ' · GPS' : '';
    const kb = p.bytes ? Math.round(p.bytes / 1024) : null;
    const pub = p.kind === 'profile'
      ? '<span class="pubtag">Нийтийн</span>'
      : '<span class="privtag">Хувийн</span>';
    const del = isSuper
      ? `<button class="delphoto" data-id="${p.id}" data-kind="${label[p.kind]||p.kind}">Устгах</button>`
      : '';
    return `<figure>${img}${lock}
      <figcaption>${label[p.kind] || p.kind}<br>${fmtDate(p.taken_at)}${geo}
        ${kb ? `<br><span class="kbtag">${kb} KB</span>` : ''}</figcaption>
      ${pub}${del}
    </figure>`;
  }).join('');

  // Any profile photo that is not yet public gets promoted on its own.
  // Asking the herder to press a button for this was a design mistake:
  // they cannot see the public page, so they cannot tell it is missing.
  document.querySelectorAll('.delphoto').forEach(b =>
    b.addEventListener('click', () => deletePhoto(b.dataset.id, b.dataset.kind)));

  autoPublish(data);

  // Tell the owner plainly whether a public photo exists, because the
  // tap page is the one screen they cannot check for themselves.
  const note = document.getElementById('pubNote');
  if (note) {
    note.innerHTML = cow.public_photo_path
      ? `<span style="color:var(--steppe)">✓ Нийтийн зураг бэлэн — таг уншуулахад харагдана</span>`
      : `<span style="color:var(--gold)">"Бүтэн бие" зураг аваарай — таг уншуулсан хүнд зөвхөн тэр зураг харагдана.</span>`;
  }
}

async function logFeeding() {

  btn.disabled = true;
  const { error } = await sb.rpc('log_feeding', {
    p_cattle_id: cow.id,
    p_title: 'Тэжээл',
    p_detail: null

  btn.disabled = false;

}

// ---------- milk history ----------
async function loadMilkHistory(range) {
  const el = document.getElementById('milkChart');
  if (!el) return;

  const today = new Date();
  let since, buckets, labelFor;

  if (range === 'week') {
    since = new Date(today); since.setDate(today.getDate() - 6);
    buckets = 7;
    labelFor = d => ['Ням','Дав','Мяг','Лха','Пүр','Баа','Бям'][d.getDay()];
  } else if (range === 'month') {
    since = new Date(today); since.setDate(today.getDate() - 29);
    buckets = 30;
    labelFor = d => d.getDate();
  } else {
    // Start on the 1st so the oldest bar is a whole month, not a
    // month cut off at today's day number.
    since = new Date(today.getFullYear(), today.getMonth() - 11, 1);
    buckets = 12;
    labelFor = d => (d.getMonth() + 1) + 'сар';
  }

  const { data, error } = await sb
    .from('milk_yield')
    .select('liters, yield_date')
    .eq('cattle_id', cow.id)
    .gte('yield_date', mnDate(since))
    .order('yield_date');

  if (error) { el.innerHTML = '<p class="hint">Ачаалж чадсангүй.</p>'; return; }

  // build empty buckets then fill
  const series = [];
  for (let i = 0; i < buckets; i++) {
    const d = new Date(since);
    if (range === 'year') d.setMonth(since.getMonth() + i);
    else d.setDate(since.getDate() + i);
    series.push({ date: d, label: labelFor(d), liters: 0 });
  }

  (data || []).forEach(row => {
    const rd = new Date(row.yield_date + 'T00:00:00');
    let idx;
    if (range === 'year') {
      idx = (rd.getFullYear() - since.getFullYear()) * 12 + (rd.getMonth() - since.getMonth());
    } else {
      idx = Math.round((rd - new Date(since.toDateString())) / 86400000);
    }
    if (idx >= 0 && idx < buckets) series[idx].liters += Number(row.liters);
  });

  const max = Math.max(...series.map(s => s.liters), 1);
  const total = series.reduce((s, x) => s + x.liters, 0);
  const days = series.filter(s => s.liters > 0).length;
  const avg = days ? total / days : 0;

  // for month view, only label every 5th day so it stays readable
  const showLabel = (i) => range === 'month' ? (i % 5 === 0) : true;

  el.innerHTML = `
    <div class="bars">
      ${series.map(s => `<div class="${s.liters ? '' : 'zero'}"
        style="height:${Math.max(2, (s.liters / max) * 100)}%"
        title="${s.label}: ${s.liters.toFixed(1)} л"></div>`).join('')}
    </div>
    <div class="barlabels">
      ${series.map((s,i) => `<span>${showLabel(i) ? s.label : ''}</span>`).join('')}
    </div>
    <div class="milk-total"><span>Нийт</span><b>${total.toFixed(1)} л</b></div>
    <div class="milk-total" style="border-top:0;padding-top:0;margin-top:0">
      <span>Дунджаар (бүртгэсэн өдөр)</span><b>${avg.toFixed(1)} л</b></div>
  `;
}

// ---------- scan log ----------
// Through the offline queue (offline.js): kept on the phone first,
// sent now if there is signal, otherwise as soon as there is.
// scan_events.client_uuid is unique, so a retry can never double up.
async function logScan() {
  let uid = cacheGet('yt-uid');
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) uid = session.user.id;
  } catch (e) {}
  if (!uid) return;

  const r = await ytQueue.add('app_scan', {
    client_uuid: ytUuid(),
    farm_id: cow.farm_id,
    cattle_id: cow.id,
    scanned_by: uid,
    method: 'nfc',
    lat: gps ? gps.lat : null,
    lng: gps ? gps.lng : null,
    accuracy_m: gps ? gps.accuracy : null,
    scanned_at: openedAt
  });
  if (r.queued) toast('Сүлжээгүй — уншуулалт утсанд хадгалагдлаа');
}
