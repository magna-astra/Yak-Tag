name: Weekly database backup

# v2 — REST API export, no pg_dump.
#
# Supabase's direct DB connection is IPv6-only; GitHub runners are IPv4-only,
# so psql cannot connect from CI. This exports every table over REST instead.
#
# ⚠️ THIS REPO MUST BE PRIVATE — exports contain real farm and herder data.
#
# Secrets required: SUPABASE_URL, SUPABASE_SERVICE_KEY

on:
  schedule:
    - cron: '0 3 * * 0'     # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Export all tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          python3 scripts/export_supabase.py "backups/$STAMP"
          cp db/schema.sql "backups/$STAMP/schema.sql" || true
          du -sh "backups/$STAMP"

      - name: Keep only the last 12 backups
        run: |
          cd backups
          ls -1dt */ 2>/dev/null | tail -n +13 | xargs -r rm -rf --
          ls -1d */ 2>/dev/null || true

      - name: Commit
        run: |
          git config user.name  "yaktag-backup"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
