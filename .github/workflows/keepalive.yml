name: Keep Supabase awake

# Supabase free projects pause after 7 days without activity.
#
# v2 — the first version only failed on 5xx, so a 401 (bad key) passed
# as green while doing nothing. This version:
#   1. runs a real SQL query against the database (unambiguous activity)
#   2. pings the REST API and FAILS on anything that is not 200
#   3. runs every 2 days, not 3, for margin

on:
  schedule:
    - cron: '0 6 */2 * *'    # every 2 days, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      # --- 1. real database activity ---
      - name: Query the database
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$PGCONN" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi
          psql "$PGCONN" -Atc "select now(), count(*) from farms;" \
            || { echo "::error::Database query failed."; exit 1; }
          echo "Database query OK"

      # --- 2. REST ping, strict ---
      - name: Ping REST endpoint
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is not set."
            exit 1
          fi

          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "${URL}/rest/v1/farms?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "HTTP $code"
          echo "Response: $(head -c 300 /tmp/body)"

          case "$code" in
            200) echo "REST ping OK" ;;
            401|403) echo "::error::HTTP $code — anon key is wrong or expired."; exit 1 ;;
            404)     echo "::error::HTTP 404 — table 'farms' not found. Has schema.sql been run?"; exit 1 ;;
            000)     echo "::error::No response — check SUPABASE_URL."; exit 1 ;;
            *)       echo "::error::Unexpected HTTP $code"; exit 1 ;;
          esac
