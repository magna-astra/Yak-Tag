name: Keep Supabase awake

# v3 — no psql.
#
# Supabase's direct DB connection (db.xxx.supabase.co) is IPv6-only and
# GitHub Actions runners are IPv4-only, so psql can never connect from here.
# This version uses the REST API only, and performs a real WRITE to the
# heartbeat table, which counts as genuine database activity.
#
# Requires: db/heartbeat.sql to have been run once.
# Secrets:  SUPABASE_URL, SUPABASE_SERVICE_KEY, SUPABASE_ANON_KEY

on:
  schedule:
    - cron: '0 6 */2 * *'    # every 2 days, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Check secrets are present
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$URL" ]  || { echo "::error::SUPABASE_URL not set"; exit 1; }
          [ -n "$ANON" ] || { echo "::error::SUPABASE_ANON_KEY not set"; exit 1; }
          [ -n "$SVC" ]  || { echo "::error::SUPABASE_SERVICE_KEY not set"; exit 1; }
          echo "Secrets present."

      # --- WRITE: real database activity ---
      - name: Write heartbeat
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SVC: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          code=$(curl -s -o /tmp/w -w "%{http_code}" -X POST \
            "${URL}/rest/v1/heartbeat" \
            -H "apikey: ${SVC}" \
            -H "Authorization: Bearer ${SVC}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "{\"id\":1,\"last_ping\":\"${STAMP}\",\"source\":\"github-actions\"}")

          echo "Write HTTP $code"
          echo "Response: $(head -c 300 /tmp/w)"

          case "$code" in
            200|201|204) echo "Heartbeat written." ;;
            401|403) echo "::error::HTTP $code - service key wrong or expired."; exit 1 ;;
            404) echo "::error::HTTP 404 - heartbeat table missing. Run db/heartbeat.sql."; exit 1 ;;
            *) echo "::error::Unexpected HTTP $code on write"; exit 1 ;;
          esac

      # --- READ: confirms the API path used by the app works too ---
      - name: Read farms
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/r -w "%{http_code}" \
            "${URL}/rest/v1/farms?select=id,code&limit=5" \
            -H "apikey: ${ANON}" \
            -H "Authorization: Bearer ${ANON}")

          echo "Read HTTP $code"
          echo "Response: $(head -c 300 /tmp/r)"

          [ "$code" = "200" ] || { echo "::error::Read failed with HTTP $code"; exit 1; }
          echo "Read OK."
