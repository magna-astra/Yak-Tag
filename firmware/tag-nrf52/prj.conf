# YAK-TAG BLE tag (BLE_TAG_SPEC.md v1): broadcast only, lowest power.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="YT-H"
CONFIG_ADC=y

# nothing else running: no serial port, console or log (they cost battery)
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n

# A cheap beacon may have no 32.768 kHz crystal. Then uncomment:
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
