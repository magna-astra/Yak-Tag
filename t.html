<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>YAK-TAG — Малын бүртгэл</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" href="assets/logo-180.png">
<meta name="theme-color" content="#0E1929">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#0E1929; --ink-soft:#5A6880; --line:#E3E7ED; --bg:#F6F7F9; --card:#fff;
  --khukh:#1B4FA8; --khukh-l:#EAF0FB;
  --gold:#B8892C; --gold-l:#FBF3E2;
  --steppe:#2C7A45; --steppe-l:#E7F4EC;
  --alert:#B3341F; --alert-l:#FCEAE7;
  --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:40px}
button,a{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--ink);color:#fff;padding:16px 0 26px;margin-bottom:-16px}
.hrow{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto;padding:0 16px}
.hrow img{width:26px;height:26px;filter:invert(1)}
.hrow .brand{font-weight:700;font-size:.88rem;letter-spacing:.05em}
.hrow .lang{margin-left:auto;font-size:.78rem;color:#8FA2BC}

/* lost banner */
.lostbar{background:var(--alert);color:#fff;padding:16px;border-radius:14px;
  margin:0 0 14px;display:flex;gap:12px;align-items:flex-start}
.lostbar .ic{font-size:1.3rem;line-height:1}
.lostbar b{display:block;font-size:1rem;margin-bottom:3px}
.lostbar p{font-size:.87rem;opacity:.94;line-height:1.5}

/* id card */
.idcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px;margin-bottom:14px;box-shadow:0 4px 16px rgba(14,25,41,.06)}
.idlabel{font-size:.74rem;font-weight:600;letter-spacing:.09em;color:var(--ink-soft);
  text-transform:uppercase}
.idcode{font-family:var(--mono);font-size:2.1rem;font-weight:700;letter-spacing:-.02em;
  margin:4px 0 2px}
.idsub{color:var(--ink-soft);font-size:.9rem}

.rows{margin-top:20px;border-top:1px solid #EEF1F5;padding-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:11px 0;border-bottom:1px solid #F2F4F7}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-soft);font-size:.87rem;flex:0 0 auto}
.row .v{font-weight:600;text-align:right;font-size:.92rem}
.row .v.mono{font-family:var(--mono);font-size:.85rem}

/* verified location */
.locrow{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.tick{width:19px;height:19px;border-radius:50%;background:var(--steppe);color:#fff;
  display:grid;place-items:center;font-size:.7rem;flex:0 0 auto;font-weight:700;
  animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.verified{color:var(--steppe);font-weight:700}
.unverified{color:var(--ink-soft);font-weight:500}
.pending{color:var(--ink-soft);font-weight:500}
.failed{color:var(--gold);font-weight:600}
.spin{width:15px;height:15px;border:2px solid #D9DEE6;border-top-color:var(--khukh);
  border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#locRow{transition:none}
.locsub{display:block;font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);
  font-weight:400;margin-top:3px}

/* call */
.callbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:17px;background:var(--steppe);color:#fff;border:0;border-radius:14px;
  font-weight:700;font-size:1.05rem;text-decoration:none;margin-top:6px}
.callbtn.alert{background:var(--alert)}
.callhint{text-align:center;font-size:.8rem;color:var(--ink-soft);margin-top:10px;line-height:1.5}

/* photo */
.cowphoto{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;
  margin-bottom:14px;background:#E9ECF1;display:block}

/* login */
.loginbox{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px;text-align:center;margin-top:16px}
.loginbox h3{font-size:.95rem;font-weight:700;margin-bottom:6px}
.loginbox p{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px;line-height:1.5}
.loginbtn{display:block;width:100%;padding:15px;background:var(--khukh);color:#fff;
  border:0;border-radius:12px;font-weight:700;font-size:1rem;text-decoration:none}

.foot{text-align:center;font-size:.76rem;color:var(--ink-soft);margin-top:26px;line-height:1.6}
.foot a{color:var(--khukh);text-decoration:none}

.sharebox{background:var(--steppe-l);border:1px solid #C9E3D3;border-radius:14px;
  padding:17px;margin-bottom:14px}
.sharebox b{display:block;color:var(--steppe);font-size:.94rem;margin-bottom:4px}
.sharebox p{font-size:.84rem;color:#3E6B4F;line-height:1.5;margin-bottom:12px}
.sharebtn{display:block;width:100%;padding:13px;background:var(--steppe);color:#fff;
  border:0;border-radius:11px;font-weight:700;font-size:.94rem;text-align:center;
  text-decoration:none;margin-bottom:8px}
.sharebtn.ghost{background:#fff;color:var(--steppe);border:1.5px solid #C9E3D3;margin-bottom:0}
.minitoast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:11px;font-size:.88rem;z-index:99;max-width:88vw;
  text-align:center}

.notfound{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:44px 24px;text-align:center}
.notfound h2{font-size:1.15rem;margin-bottom:8px}
.notfound p{color:var(--ink-soft);font-size:.9rem;line-height:1.6}
.skeleton{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:40px;text-align:center;color:var(--ink-soft)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <img src="assets/logo-64.png" alt="">
    <span class="brand">YAK-TAG</span>
    <span class="lang">Малын цахим бүртгэл</span>
  </div>
</header>

<div class="wrap">
  <div id="content"><div class="skeleton">Ачаалж байна…</div></div>

  <div class="foot">
    Энэ мал YAK-TAG системд бүртгэлтэй.<br>
    <a href="index.html">yaktag.mn тухай</a>
  </div>
</div>

<script src="config.js"></script>
<script>
let scanId = null;
let cowPhone = null;
let lastPos = null;

function getTag() {
  const p = new URLSearchParams(location.search);
  return p.get('tag') || p.get('slug') || p.get('uid');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function boot() {
  const tag = getTag();
  if (!tag) {
    document.getElementById('content').innerHTML = `
      <div class="notfound">
        <h2>Таг заагаагүй байна</h2>
        <p>NFC таг руу утсаа ойртуулна уу.</p>
      </div>`;
    return;
  }

  const { data, error } = await sb.rpc('public_tag_lookup', { p_tag_code: tag });

  if (error || !data || !data.length) {
    document.getElementById('content').innerHTML = `
      <div class="notfound">
        <h2>Бүртгэл олдсонгүй</h2>
        <p>Таг <b>${esc(tag)}</b> системд бүртгэлгүй байна.<br>
        Таг гэмтсэн эсвэл идэвхгүй болсон байж болно.</p>
      </div>`;
    return;
  }

  render(data[0]);
  logScan(tag);
}

function render(c) {
  cowPhone = c.owner_phone;
  const sex = c.sex === 'female' ? 'Эм' : 'Эр';
  const age = c.birth_year ? `${new Date().getFullYear() - c.birth_year} нас` : '—';

  // This row reports THIS tap's GPS capture, live. It starts as "locating",
  // then turns green the moment the position is recorded — so whoever is
  // holding the animal can see the scan was logged, not just claimed.
  // The animal's live position is never displayed publicly; only the fact
  // that it was captured.
  const locBlock = `<div class="locrow" id="locRow">
       <span class="spin"></span>
       <span class="pending">Тогтоож байна…</span>
     </div>`;

  const lostBanner = c.is_lost
    ? `<div class="lostbar">
         <span class="ic">⚠</span>
         <div>
           <b>Энэ мал алга болсон гэж мэдэгдсэн</b>
           <p>${c.lost_note ? esc(c.lost_note) : 'Эзэмшигчтэй нь яаралтай холбогдоно уу.'}</p>
         </div>
       </div>`
    : '';

  const callBtn = c.owner_phone
    ? `<a href="tel:${esc(c.owner_phone).replace(/\s/g,'')}"
          class="callbtn ${c.is_lost ? 'alert' : ''}" id="callBtn">
         <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
           <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
         </svg>
         Эзэмшигч рүү залгах
       </a>
       <p class="callhint">${esc(c.owner_name)} · ${esc(c.owner_phone)}</p>`
    : `<p class="callhint">Эзэмшигчийн утасны дугаар нээлттэй биш байна.</p>`;

  document.getElementById('content').innerHTML = `
    ${lostBanner}
    <div class="idcard">
      <div class="idlabel">Малын дугаар</div>
      <div class="idcode">${esc(c.tag_code)}</div>
      <div class="idsub">${sex} · ${age}${c.breed ? ' · ' + esc(c.breed) : ''}</div>

      <div class="rows">
        <div class="row"><span class="k">Ферм</span>
          <span class="v">${esc(c.farm_name)}</span></div>
        <div class="row"><span class="k">Байршил</span>
          <span class="v">${esc(c.farm_aimag)}${c.farm_soum ? ', ' + esc(c.farm_soum) : ''}</span></div>
        <div class="row"><span class="k">Эзэмшигч</span>
          <span class="v">${esc(c.owner_name)}</span></div>
        <div class="row"><span class="k">Уншсан байршил</span>
          <span class="v">${locBlock}</span></div>
      </div>
    </div>

    ${callBtn}

    <div class="loginbox">
      <h3>Та энэ малын эзэн үү?</h3>
      <p>Нэвтэрч мэдээллийг засах, сүү бүртгэх, зураг нэмэх боломжтой.</p>
      <a href="cow.html?tag=${encodeURIComponent(c.tag_code)}" class="loginbtn">Нэвтрэх</a>
    </div>
  `;

  const btn = document.getElementById('callBtn');
  if (btn) {
    btn.addEventListener('click', () => {
      if (scanId) sb.rpc('mark_scan_contacted', { p_scan_id: scanId });
    });
  }
}

// Update the location row as the GPS result comes in.
function setLocState(state, detail) {
  const el = document.getElementById('locRow');
  if (!el) return;
  if (state === 'ok') {
    el.innerHTML = `<span class="tick">✓</span>
      <span class="verified">Бүртгэгдлээ${detail ? `<span class="locsub">${detail}</span>` : ''}</span>`;
    showLocationShare();
  } else if (state === 'denied') {
    el.innerHTML = `<span class="failed">Байршил аваагүй</span>`;
  } else {
    el.innerHTML = `<span class="unverified">Боломжгүй</span>`;
  }
}

// Once we have the finder's position, give them a one-tap way to send it
// to the owner. A plain Google Maps URL — no API, no key, no cost — and on
// a phone it opens the Maps app so the owner can navigate straight there.
function showLocationShare(){
  if (!lastPos || document.getElementById('shareBox')) return;
  const url = `https://www.google.com/maps?q=${lastPos.lat},${lastPos.lng}`;
  const box = document.createElement('div');
  box.id = 'shareBox';
  box.className = 'sharebox';
  box.innerHTML = `
    <b>Байршлаа эзэмшигчид илгээх</b>
    <p>Та энэ малыг олсон бол доорх байршлыг эзэмшигч рүү илгээнэ үү.</p>
    <a class="sharebtn" href="${url}" target="_blank" rel="noopener">Газрын зураг дээр харах</a>
    <button class="sharebtn ghost" id="copyLoc">Байршлыг хуулах</button>`;
  const anchor = document.querySelector('.idcard');
  if (anchor) anchor.insertAdjacentElement('afterend', box);

  document.getElementById('copyLoc').addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(url);
      toastMini('Хуулагдлаа — эзэмшигч рүү илгээнэ үү');
    }catch(e){
      prompt('Энэ холбоосыг хуулна уу:', url);
    }
  });
}

function toastMini(msg){
  const t = document.createElement('div');
  t.className = 'minitoast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

// Record that someone tapped this tag. For a stolen animal this is the
// most valuable signal the system produces: someone has the animal in
// their hands right now. The owner sees these in their dashboard.
function logScan(tag) {
  const send = (lat, lng, acc) => {
    sb.rpc('record_public_scan', {
      p_tag_code: tag,
      p_lat: lat, p_lng: lng, p_accuracy: acc,
      p_user_agent: navigator.userAgent.slice(0, 200)
    }).then(({ data, error }) => {
      scanId = data;
      // Only claim it was registered once the server actually accepted it.
      if (error) { setLocState('unavailable'); return; }
      if (lat != null) {
        setLocState('ok', `${lat.toFixed(4)}, ${lng.toFixed(4)}` +
                          (acc ? ` · ±${Math.round(acc)}м` : ''));
      } else {
        setLocState('denied');
      }
    });
  };

  if (!navigator.geolocation) { setLocState('unavailable'); send(null, null, null); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      lastPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      send(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    },
    ()  => send(null, null, null),
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

boot();
</script>
</body>
</html>
